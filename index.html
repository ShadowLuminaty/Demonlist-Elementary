<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demonlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13101f; --card:#262140; --card-hi:#2e2852; --bar:#1b1731; --line:#3d3668;
  --text:#ece8ff; --mute:#a9a1cf; --accent:#a78bfa; --link:#c4b5fd;
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:500 1rem/1.5 var(--font);min-height:100vh}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Décor de carrés violets à gauche */
.deco{position:fixed;left:0;top:0;bottom:0;width:240px;overflow:hidden;pointer-events:none;z-index:0}
.deco i{position:absolute;display:block}

.wrap{position:relative;z-index:1;max-width:1420px;margin:0 auto 0 270px;padding:0 24px 60px 0}
header{padding:40px 0 22px}
h1{font:800 clamp(1.8rem,4.5vw,2.6rem)/1.1 var(--font);margin:0}
.sub{color:var(--mute);margin:8px 0 0;max-width:60ch;font-size:.95rem}

.tabs{display:flex;flex-wrap:wrap;border:1px dashed var(--line);background:var(--bar)}
.tabs button{flex:1 1 0;min-width:130px;font:700 1rem var(--font);color:var(--text);background:transparent;border:0;border-right:1px dashed var(--line);padding:16px 10px;cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button:hover{background:#221d3d}
.tabs button[aria-pressed="true"]{background:var(--card);box-shadow:inset 0 -3px 0 var(--accent)}
.search{margin:18px 0 0}
.search input{width:100%;font:500 1rem var(--font);color:var(--text);background:var(--bar);border:1px dashed var(--line);padding:12px 16px;border-radius:0}

.item{background:var(--card);border:1px dashed var(--line);margin-top:34px}
.item:hover{background:var(--card-hi)}
.item[open]{border:1px solid var(--accent)}
summary{list-style:none;display:flex;align-items:center;gap:26px;padding:24px 26px;cursor:pointer}
summary::-webkit-details-marker{display:none}
.thumb{flex:0 0 258px;width:258px;aspect-ratio:16/9;object-fit:cover;display:block;background:linear-gradient(135deg,#3b2f86,#7c3aed)}
.info{min-width:0}
.title{margin:0;font:700 clamp(1.4rem,3vw,1.9rem)/1.2 var(--font);overflow-wrap:anywhere}
.by{margin:6px 0 2px;font-weight:700;font-size:1.1rem}
.by u{text-decoration:none;border-bottom:1px dotted var(--mute)}
.pts{margin:2px 0 0;color:var(--mute);font-size:.95rem}

.detail{padding:6px 26px 24px;border-top:1px dashed var(--line)}
.detail h3{font:700 1.1rem var(--font);margin:20px 0 8px}
.detail ul{margin:0;padding-left:20px}
.detail li{margin:4px 0}
.mute{color:var(--mute);font-size:.95rem}
.cover{display:block;width:100%;max-width:480px;margin-top:14px}
.video{position:relative;width:100%;max-width:560px;aspect-ratio:16/9;margin-top:6px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{color:var(--mute);padding:24px 0}
footer{margin-top:44px;color:var(--mute);font-size:.95rem}

/* Disposition : liste + panneau des changements à droite */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px;align-items:start}
.side{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;background:var(--card);border:1px dashed var(--line);padding:18px 18px 14px}
.side h2{font:700 1.15rem var(--font);margin:0 0 14px}
.chglist{list-style:none;margin:0;padding:0}
.chg{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px dashed var(--line);font-size:.95rem;line-height:1.4}
.chg:first-child{border-top:0;padding-top:0}
.chg .mute{font-size:.88rem}
.ic{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bar);border:1px solid currentColor}
.ic.add,.ic.up{color:#3ddc97}
.ic.down{color:#ffa94d}
.ic.del{color:#ff6b81}
.lk{color:var(--link)}
.when{color:var(--mute);font-size:.8rem;margin-top:2px}
.refreshed{margin:12px 0 0;font-size:.8rem}

@media (max-width:1180px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;margin-top:34px}
}
@media (max-width:900px){
  .deco{width:70px}
  .wrap{margin-left:86px;padding-right:16px}
}
@media (max-width:700px){
  summary{flex-direction:column;align-items:flex-start;gap:16px;padding:18px}
  .thumb{flex:0 0 auto;width:100%}
  .detail{padding:4px 18px 20px}
}
@media (max-width:600px){
  .deco{display:none}
  .wrap{margin:0 auto;padding:0 16px 50px}
}
</style>
</head>
<body>
<div class="deco" id="deco" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="sub" id="subtitle"></p>
  </header>

  <div class="cols">
  <div class="main">
  <nav class="tabs">
    <button id="tab-liste" aria-pressed="true">Niveaux</button>
    <button id="tab-joueurs" aria-pressed="false">Joueurs</button>
    <button id="tab-verifs" aria-pressed="false">Vérifications</button>
  </nav>

  <div class="search">
    <input id="search" type="search" placeholder="Chercher un niveau ou un joueur" aria-label="Rechercher">
  </div>

  <main id="out"></main>

  <footer>
    Tu as battu un niveau de la liste ? <a id="discord" href="#" target="_blank" rel="noopener">Envoie ta preuve sur le Discord</a>.
  </footer>
  </div>

  <aside class="side" aria-label="Changements récents">
    <h2>Changements récents</h2>
    <ul class="chglist" id="changes"></ul>
    <p class="mute refreshed" id="refreshed">Mise à jour automatique toutes les minutes</p>
  </aside>
  </div>
</div>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);

// Données courantes (rechargées automatiquement quand data.js change)
let D = {
  SITE,
  LEVELS,
  UPCOMING: typeof UPCOMING !== "undefined" ? UPCOMING : [],
  CHANGELOG: typeof CHANGELOG !== "undefined" ? CHANGELOG : []
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pts = rank => Math.round(D.SITE.maxPoints * Math.pow(D.SITE.decay, rank - 1) * 100) / 100;
const ytId = u => { const m = /(?:youtu\.be\/|v=|embed\/)([\w-]{11})/.exec(u || ""); return m ? m[1] : null; };
const safeUrl = u => /^https?:\/\//.test(u || "") ? u : "";
const link = (u, label) => safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${label}</a>` : "";
const imgSrc = s => /^(https?:\/\/|[\w\-.\/]+$)/.test(s || "") ? s : "";
const ordinal = n => { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

// ---------- Décor : carrés violets (positions fixes, générées une fois) ----------
(function deco() {
  const colors = ["#c9a8ff", "#b58cff", "#8a52f0", "#6a38c8", "#5a2fa8", "#9f7bd8", "#7d5fb0", "#4a2a94"];
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  let out = "";
  for (let i = 0; i < 140; i++) {
    const s = 34 + Math.floor(rnd() * 58);
    const x = Math.floor(Math.pow(rnd(), 1.5) * 235) - 25;
    const y = Math.floor(rnd() * 2000) - 30;
    const c = colors[Math.floor(rnd() * colors.length)];
    const o = (0.55 + rnd() * 0.45).toFixed(2);
    out += `<i style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${c};opacity:${o}"></i>`;
  }
  $("#deco").innerHTML = out;
})();

const h = location.hash.slice(1);
const hashTabs = { joueurs: "joueurs", verifications: "verifs", upcoming: "verifs" };
let tab = hashTabs[h] || "liste";

// Part des points gagnée avec un « progrès » (record partiel). Modifiable dans data.js : SITE.partialShare
let PARTIAL = (typeof D.SITE.partialShare === "number") ? D.SITE.partialShare : 0.1;
const isFull = r => r.percent == null || r.percent >= 100;

// Calcule le classement des joueurs à partir des niveaux
function computePlayers() {
  const map = {};
  const get = n => map[n] || (map[n] = { name: n, points: 0, verified: [], beaten: [], progress: [] });
  D.LEVELS.forEach((l, i) => {
    const rank = i + 1, p = pts(rank);
    if (l.verifier) { const pl = get(l.verifier); pl.points += p; pl.verified.push({ l, rank, p }); }
    // meilleur record de chaque joueur sur ce niveau (le 100 % passe avant un progrès)
    const best = {};
    (l.records || []).forEach(r => {
      if (r.player === l.verifier) return; // pas de double comptage
      const full = isFull(r);
      if (!full && !(l.minPercent && r.percent >= l.minPercent)) return; // progrès sous le minimum : 0 point
      const cur = best[r.player];
      if (!cur || (full && !cur.full) || (!full && !cur.full && r.percent > cur.r.percent)) best[r.player] = { r, full };
    });
    Object.entries(best).forEach(([name, { r, full }]) => {
      const pl = get(name), gain = full ? p : p * PARTIAL;
      pl.points += gain;
      (full ? pl.beaten : pl.progress).push({ l, rank, p: gain, r });
    });
  });
  return Object.values(map).sort((a, b) => b.points - a.points);
}

function ptsLine(l, p) {
  return l.minPercent
    ? `${(p * PARTIAL).toFixed(2)} (${esc(l.minPercent)}%) — ${p.toFixed(2)} (100%) points`
    : `${p.toFixed(2)} points`;
}

function levelHTML(l, i) {
  const rank = i + 1, id = ytId(l.video), p = pts(rank);
  const thumb = id
    ? `<img class="thumb" loading="lazy" alt="" src="https://img.youtube.com/vi/${id}/mqdefault.jpg">`
    : `<div class="thumb"></div>`;
  const all = l.records || [];
  const full = all.filter(isFull);
  const part = all.filter(r => !isFull(r)).sort((a, b) => b.percent - a.percent);
  const recs = full.map((r, k) =>
    `<li><strong>${ordinal(k + 1)} victor</strong> : ${esc(r.player)} <span class="mute">${esc(r.date || "")}</span> ${link(r.video, "vidéo")}</li>`).join("");
  const prog = part.map(r =>
    `<li><strong>${esc(r.percent)}%</strong> : ${esc(r.player)} <span class="mute">${esc(r.date || "")}</span> ${link(r.video, "vidéo")}${r.percent >= l.minPercent ? ` <span class="mute">+${(p * PARTIAL).toFixed(2)} pts</span>` : ` <span class="mute">(sous le minimum)</span>`}</li>`).join("");
  const progSection = l.minPercent
    ? `<h3>Progrès (à partir de ${esc(l.minPercent)}%)</h3>
      <p class="mute">Atteindre ${esc(l.minPercent)}% du niveau rapporte ${Math.round(PARTIAL * 100)}% des points.</p>
      ${prog ? `<ul>${prog}</ul>` : `<p class="mute">Aucun progrès enregistré.</p>`}`
    : "";
  return `<details class="item">
    <summary>
      ${thumb}
      <div class="info">
        <h2 class="title">#${rank} – ${esc(l.name)}</h2>
        <p class="by">publié par <u>${esc(l.creator)}</u></p>
        <p class="pts">${ptsLine(l, p)}</p>
      </div>
    </summary>
    <div class="detail">
      <h3>Informations</h3>
      <ul>
        <li>Créateur : ${esc(l.creator)}</li>
        <li>Vérifié par : ${esc(l.verifier)} ${link(l.video, "vidéo de la vérification")}</li>
        <li>ID du niveau : ${esc(l.id)}</li>
      </ul>
      <h3>Records (${full.length})</h3>
      ${recs ? `<ul>${recs}</ul>` : `<p class="mute">Personne n’a encore battu ce niveau.</p>`}
      ${progSection}
    </div>
  </details>`;
}

function playerHTML(p, i) {
  const rank = i + 1;
  const row = x => `<li>#${x.rank} ${esc(x.l.name)} <span class="mute">+${x.p.toFixed(2)} pts</span> ${x.r ? link(x.r.video, "vidéo") : ""}</li>`;
  const rowProg = x => `<li>#${x.rank} ${esc(x.l.name)} <strong>${esc(x.r.percent)}%</strong> <span class="mute">+${x.p.toFixed(2)} pts</span> ${link(x.r.video, "vidéo")}</li>`;
  return `<details class="item">
    <summary>
      <div class="info">
        <h2 class="title">#${rank} – ${esc(p.name)}</h2>
        <p class="pts">${p.points.toFixed(2)} points</p>
      </div>
    </summary>
    <div class="detail">
      <h3>Niveaux vérifiés (${p.verified.length})</h3>
      ${p.verified.length ? `<ul>${p.verified.map(row).join("")}</ul>` : `<p class="mute">Aucun.</p>`}
      <h3>Niveaux battus (${p.beaten.length})</h3>
      ${p.beaten.length ? `<ul>${p.beaten.map(row).join("")}</ul>` : `<p class="mute">Aucun.</p>`}
      <h3>Progrès (${p.progress.length})</h3>
      ${p.progress.length ? `<ul>${p.progress.map(rowProg).join("")}</ul>` : `<p class="mute">Aucun.</p>`}
    </div>
  </details>`;
}

function upcomingHTML(u) {
  const vid = ytId(u.video);
  const img = imgSrc(u.image);
  const thumbSrc = img || (vid ? `https://img.youtube.com/vi/${vid}/mqdefault.jpg` : "");
  const thumb = thumbSrc
    ? `<img class="thumb" loading="lazy" alt="" src="${esc(thumbSrc)}">`
    : `<div class="thumb"></div>`;
  let media = "";
  if (vid) {
    media = `<h3>Vidéo de démonstration</h3>
      <div class="video"><iframe loading="lazy" title="Démonstration de ${esc(u.name)}" src="https://www.youtube-nocookie.com/embed/${vid}" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  } else if (safeUrl(u.video)) {
    media = `<h3>Vidéo de démonstration</h3><p>${link(u.video, "Voir la vidéo")}</p>`;
  } else if (img) {
    media = `<img class="cover" loading="lazy" alt="" src="${esc(img)}">`;
  }
  return `<details class="item">
    <summary>
      ${thumb}
      <div class="info">
        <h2 class="title">${esc(u.name)}</h2>
        <p class="by">publié par <u>${esc(u.creator)}</u></p>
        <p class="pts">${esc(u.status || "En vérification")} — vérifié par ${esc(u.verifier)}</p>
      </div>
    </summary>
    <div class="detail">
      ${media}
      <h3>Informations</h3>
      <ul>
        <li>Créateur : ${esc(u.creator)}</li>
        <li>Vérificateur : ${esc(u.verifier)}</li>
        ${u.progress != null ? `<li>Progression du vérificateur : ${esc(u.progress)}${/\d$/.test(String(u.progress)) ? "%" : ""}</li>` : ""}
        <li>ID du niveau : ${esc(u.id)}</li>
      </ul>
    </div>
  </details>`;
}

// ---------- Panneau « Changements récents » ----------
const ICONS = {
  add:  { cls: "add",  svg: '<path d="M10 5h4v5h5v4h-5v5h-4v-5H5v-4h5z"/>' },
  up:   { cls: "up",   svg: '<path d="M12 5l-7 8h4.5v6h5v-6H19z"/>' },
  down: { cls: "down", svg: '<path d="M12 19l7-8h-4.5V5h-5v6H5z"/>' },
  del:  { cls: "del",  svg: '<path d="M5 10h14v4H5z"/>' }
};

function changeHTML(c) {
  const names = D.LEVELS.map(l => l.name);
  const idx = names.indexOf(c.level);
  // « au-dessus de » = le niveau juste après dans la liste ; « en dessous de » = le niveau juste avant
  const above = c.above ?? (idx >= 0 && idx < names.length - 1 ? names[idx + 1] : null);
  const below = c.below ?? (idx > 0 ? names[idx - 1] : null);
  const hasFrom = c.from != null, hasTo = c.to != null;
  let kind, what;
  if (!hasFrom && hasTo) { kind = "add"; what = `placé à #${esc(c.to)}`; }
  else if (hasFrom && !hasTo) { kind = "del"; what = `retiré de la liste (était #${esc(c.from)})`; }
  else { kind = c.to < c.from ? "up" : "down"; what = `#${esc(c.from)} → #${esc(c.to)}`; }
  const near = [];
  if (above) near.push(`au-dessus de <span class="lk">${esc(above)}</span>`);
  if (below) near.push(`en dessous de <span class="lk">${esc(below)}</span>`);
  const date = /^\d{4}-\d{2}-\d{2}$/.test(c.date || "") ? c.date.split("-").reverse().join("/") : esc(c.date || "");
  const ic = ICONS[kind];
  return `<li class="chg">
    <span class="ic ${ic.cls}" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">${ic.svg}</svg></span>
    <div><strong>${esc(c.level)}</strong> <span class="mute">${what}${near.length ? ", " + near.join(", ") : ""}</span>
    ${date ? `<div class="when">${date}</div>` : ""}</div>
  </li>`;
}

function renderChanges() {
  const list = D.CHANGELOG.map((c, i) => [c, i])
    .sort((a, b) => String(b[0].date || "").localeCompare(String(a[0].date || "")) || a[1] - b[1])
    .map(([c]) => changeHTML(c)).join("");
  $("#changes").innerHTML = list || `<li class="mute">Aucun changement pour le moment.</li>`;
}

// ---------- Mise à jour automatique ----------
function applySite() {
  $("#title").textContent = D.SITE.title;
  $("#subtitle").textContent = D.SITE.subtitle;
  document.title = D.SITE.title;
  $("#discord").href = safeUrl(D.SITE.discord) || "#";
}

function applyData(next) {
  D = next;
  PARTIAL = (typeof D.SITE.partialShare === "number") ? D.SITE.partialShare : 0.1;
  applySite(); render(); renderChanges();
}

function stamp() {
  $("#refreshed").textContent = "Vérifié à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

let lastText = null;
async function refresh() {
  if (document.visibilityState === "hidden") return;
  try {
    const res = await fetch("data.js?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const text = await res.text();
    stamp();
    if (text === lastText) return;
    const next = new Function(text + "\n;return { SITE, LEVELS, UPCOMING: typeof UPCOMING !== 'undefined' ? UPCOMING : [], CHANGELOG: typeof CHANGELOG !== 'undefined' ? CHANGELOG : [] };")();
    lastText = text;
    applyData(next);
  } catch (e) { /* hors ligne, ouverture en local ou erreur dans data.js : on garde les données actuelles */ }
}

function render() {
  const q = $("#search").value.trim().toLowerCase();
  let html = "";
  if (tab === "liste") {
    html = D.LEVELS.map((l, i) => [l, i])
      .filter(([l]) => !q || [l.name, l.creator, l.verifier].some(s => String(s).toLowerCase().includes(q)))
      .map(([l, i]) => levelHTML(l, i)).join("");
  } else if (tab === "verifs") {
    const up = D.UPCOMING;
    html = up.filter(u => !q || [u.name, u.creator, u.verifier].some(s => String(s).toLowerCase().includes(q)))
      .map(upcomingHTML).join("");
  } else {
    html = computePlayers().map((p, i) => [p, i])
      .filter(([p]) => !q || p.name.toLowerCase().includes(q))
      .map(([p, i]) => playerHTML(p, i)).join("");
  }
  $("#out").innerHTML = html || `<p class="empty">Aucun résultat.</p>`;
  $("#tab-liste").setAttribute("aria-pressed", tab === "liste");
  $("#tab-joueurs").setAttribute("aria-pressed", tab === "joueurs");
  $("#tab-verifs").setAttribute("aria-pressed", tab === "verifs");
}

applySite();
$("#tab-liste").onclick = () => { tab = "liste"; location.hash = "liste"; render(); };
$("#tab-joueurs").onclick = () => { tab = "joueurs"; location.hash = "joueurs"; render(); };
$("#tab-verifs").onclick = () => { tab = "verifs"; location.hash = "verifications"; render(); };
$("#search").oninput = render;
render();
renderChanges();
setInterval(refresh, 60000);
refresh();
</script>
</body>
</html>
